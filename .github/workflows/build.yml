name: BananaCreat Build & Release

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x BananaCreat/gradlew

    - name: Build debug APK
      run: |
        cd BananaCreat
        ./gradlew assembleDebug --info

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: bananacreat-debug-apk
        path: BananaCreat/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: BananaCreat/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build succeeded
      run: |
        echo "✓ BananaCreat APK built successfully!"
        ls -lh BananaCreat/app/build/outputs/apk/debug/app-debug.apk
